[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "about-llm"
version = "0.1.0"
description = "Executable Chinese curriculum for LLM developers and algorithm engineers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-4.0" }
authors = [{ name = "about-llm contributors" }]
dependencies = [
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
docs = ["mkdocs-material>=9.5,<10"]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
  "mypy>=1.13,<2",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "ipykernel>=6,<8",
]
torch = ["torch>=2.2,<3"]
jax = ["jax>=0.4.30,<1", "flax>=0.10,<1", "optax>=0.2.4,<1"]
transformers = [
  "transformers>=4.48,<5",
  "datasets>=3,<5",
  "accelerate>=1,<2",
  "sentencepiece>=0.2,<1",
]
finetune = ["peft>=0.14,<1", "trl>=0.13,<1"]
qlora = ["bitsandbytes>=0.45,<1"]
rag = [
  "sentence-transformers>=3.3,<6",
  "rank-bm25>=0.2.2,<1",
  "faiss-cpu>=1.9,<2; platform_system != 'Windows'",
]
langchain = ["langchain>=0.3,<2", "langchain-community>=0.3,<2"]
llamaindex = ["llama-index-core>=0.12,<1"]
api = ["httpx>=0.28,<1", "pydantic>=2.10,<3", "python-dotenv>=1,<2"]
evaluation = ["jsonschema>=4.23,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "gpu: requires a CUDA-capable GPU",
  "network: performs an external network or paid API call",
  "slow: takes longer than the default unit-test budget",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["RUF001"]  # Full-width punctuation is intentional in Chinese examples.

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["about_llm"]
