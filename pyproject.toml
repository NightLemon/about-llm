[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "about-llm"
version = "0.1.0"
description = "Executable Chinese curriculum for LLM developers and algorithm engineers"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE-CODE"]
authors = [{ name = "about-llm contributors" }]
dependencies = [
  # NumPy 2.5 stubs use Python 3.12-only type statements. Keep the core
  # dependency compatible with this project's Python 3.10 mypy target.
  "numpy>=1.26,<2.5",
]

[project.scripts]
about-llm-agent = "about_llm.agents.cli:main"
about-llm-cloud-contract = "about_llm.integrations.cloud_api_cli:main"
about-llm-eval = "about_llm.evaluation.cli:main"
about-llm-sft-data = "about_llm.finetuning_cli:main"
about-llm-inference-analyze = "about_llm.inference_analysis_cli:main"
about-llm-preference-data = "about_llm.preference_cli:main"
about-llm-rag = "about_llm.rag.cli:main"
about-llm-synthetic-audit = "about_llm.synthetic_data_cli:main"

[project.optional-dependencies]
docs = ["Markdown>=3.8,<4", "mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]
dev = [
  "Markdown>=3.8,<4",
  "mkdocs>=1.6,<2",
  "build>=1.2,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
  "mypy>=1.13,<2",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "ipykernel>=6,<8",
]
torch = ["torch>=2.2,<3"]
jax = ["jax>=0.4.30,<1", "flax>=0.10,<1", "optax>=0.2.4,<1"]
transformers = [
  "transformers>=4.48,<5",
  "datasets>=3,<5",
  "accelerate>=1,<2",
  "sentencepiece>=0.2,<1",
]
finetune = ["peft>=0.14,<1", "trl>=0.29,<0.30", "safetensors>=0.4,<1"]
qlora = ["bitsandbytes>=0.45,<1"]
rag = [
  "sentence-transformers>=3.3,<6",
  "rank-bm25>=0.2.2,<1",
  "faiss-cpu>=1.9,<2; platform_system != 'Windows'",
]
langchain = [
  "langchain>=0.3,<2",
  "langchain-community>=0.3,<2",
  "langgraph>=1,<2",
]
llamaindex = ["llama-index-core>=0.12,<1"]
api = [
  "cryptography>=46,<50",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
  # Keep FastAPI/Starlette in the exercised family. MCP 1.29 requires
  # Uvicorn >=0.31.1; the 0.52 line is covered by the service controls.
  "fastapi>=0.115.6,<0.116",
  "starlette>=0.40,<0.42",
  "uvicorn>=0.52,<0.53",
]
evaluation = ["jsonschema>=4.23,<5"]
agents = [
  "a2a-sdk>=1.1,<1.2",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "mcp>=1.29,<1.30",
  "sse-starlette>=2.4,<3",
  "starlette>=0.40,<0.42",
  "uvicorn>=0.52,<0.53",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "formula: validates a mathematical definition or algorithmic invariant used by the curriculum",
  "contract: validates an input, output, artifact, or protocol contract",
  "security: validates a fail-closed authorization or safety boundary",
  "smoke: validates that a documented learner or packaging entry point executes",
  "integration: crosses a framework, process, socket, database, or other component boundary",
  "extended: runs outside the pull-request test tier and must also be integration or slow",
  "gpu: requires a CUDA-capable GPU",
  "network: performs an external network or paid API call",
  "slow: takes longer than the one-second per-case review budget; importance is independent of speed",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["RUF001"]  # Full-width punctuation is intentional in Chinese examples.

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["about_llm"]

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true
