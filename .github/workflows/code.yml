name: code

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,torch,jax,transformers,finetune,rag,langchain,llamaindex,api,evaluation]"
      - run: python -m ipykernel install --user --name about-llm
      - run: python -m ruff check .
      - run: python -m mypy src/about_llm
      - run: python -m pytest -m "not gpu and not network"
      - run: python scripts/execute_notebooks.py
