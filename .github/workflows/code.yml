name: code

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,torch,jax,transformers,finetune,langchain,llamaindex,api]"
      - run: python -m ipykernel install --user --name about-llm
      - run: ruff check .
      - run: mypy src/about_llm
      - run: pytest -m "not gpu and not network"
      - run: python scripts/execute_notebooks.py
