name: code

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints/ci.txt

jobs:
  windows-learning-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - run: python -m pip install -e ".[docs,dev]"
      - run: python scripts/check_repo_hygiene.py
      - run: python scripts/doctor.py --profile docs
      - run: python scripts/doctor.py --profile cpu-starter
      - run: python scripts/check_docs.py
      - run: python projects/transformers-basics/train_byte_bpe.py
      - run: python projects/inference-serving/sampling_toy.py
      - run: >-
          python -m about_llm.preference_cli audit
          --jsonl projects/single-gpu-finetuning/preference.example.jsonl
          --require-splits train,validation,test
          --output artifacts/windows-preference-audit.json
      - run: >-
          python -m pytest
          tests/test_sampling.py
          tests/test_preference_cli.py
          -q
      - run: mkdocs build --strict --site-dir .windows-site

  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - run: python -m pip install -e ".[dev,torch,jax,transformers,finetune,rag,langchain,llamaindex,api,evaluation,agents]"
      - run: python scripts/check_repo_hygiene.py
      - run: python -m ipykernel install --user --name about-llm
      - run: python -m ruff check .
      - run: python -m mypy src/about_llm
      - run: >-
          python -m pytest
          -m "not slow and not gpu and not network"
      - run: python scripts/execute_notebooks.py

  package-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - run: python -m pip install "build>=1.2,<2"
      - run: python -m build --wheel
      - run: python scripts/smoke_wheel.py --wheel-dir dist
