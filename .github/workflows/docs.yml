name: docs

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints/ci.txt

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - run: python -m pip install -e ".[docs]"
      - run: python scripts/check_repo_hygiene.py
      - run: python scripts/check_docs.py
      - run: python scripts/check_content_accuracy.py
      - if: github.event_name == 'schedule'
        run: python scripts/probe_sources.py --output artifacts/source-health.json
      - run: python scripts/report_readability.py --scope reader --top 30
      - run: python scripts/doctor.py --profile docs
      - run: mkdocs build --strict
      - run: python scripts/check_built_site.py
      - if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - if: github.event_name == 'schedule'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-health
          path: artifacts/source-health.json
          retention-days: 30

  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
