name: docs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[docs,dev]"
      - run: python scripts/check_docs.py
      - run: python scripts/check_content_accuracy.py
      - run: python scripts/doctor.py
      - run: mkdocs build --strict
