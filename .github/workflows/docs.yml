name: docs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      # The accuracy ledger executes real optional-runtime controls (Torch,
      # Transformers, LangChain/LlamaIndex, TRL/PEFT), not only static Markdown.
      - run: python -m pip install -e ".[docs,dev,torch,jax,transformers,finetune,rag,langchain,llamaindex,api,evaluation]"
      - run: python scripts/check_docs.py
      - run: python scripts/check_content_accuracy.py
      - run: python scripts/doctor.py
      - run: mkdocs build --strict
